name: 04 Deploy Workflow

on:
  push:
    branches: [main]

env:
  CONTAINER_NAME: tiny-health-container
  APP_PORT: "8000"
  ECR_REPOSITORY: lab-app

permissions:
  contents: read

jobs:
  deploy-package:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        # Always pull latest — the build workflow updates this tag on every push.
        id: image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          FULL_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pulling image: ${FULL_IMAGE}"

      - name: Pull image from ECR
        run: docker pull "${{ steps.image.outputs.full_image }}"

      - name: Start container
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p "${APP_PORT}:8000" \
            "${{ steps.image.outputs.full_image }}"

      - name: Show running containers
        run: docker ps

      - name: Smoke test deployed app
        run: |
          for attempt in 1 2 3 4 5; do
            RESPONSE=$(curl --silent "http://127.0.0.1:${APP_PORT}/health" || true)
            if [ -n "$RESPONSE" ]; then
              echo "Health endpoint response:"
              echo "$RESPONSE"
              exit 0
            fi
            echo "Waiting for app to become ready..."
            sleep 2
          done
          echo "App did not become ready in time."
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true
name: 04 Deploy Workflow

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: tiny-health-app
  CONTAINER_NAME: tiny-health-container
  APP_PORT: "8000"
  ECR_REPOSITORY: lab-app

permissions:
  contents: read

jobs:
  deploy-package:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        # Authenticate using the 3 lab credentials stored as secrets.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        # Exchange AWS credentials for a Docker login token scoped to ECR.
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        # Rebuild the same date-plus-run-id tag the build workflow pushed.
        id: image-tag
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          IMAGE_TAG="${TODAY}-${GITHUB_RUN_ID}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          FULL_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pulling image: ${FULL_IMAGE}"

      - name: Pull image from ECR
        # Pull the exact image the build workflow pushed.
        run: docker pull "${{ steps.image-tag.outputs.full_image }}"

      - name: Start container
        run: |
          echo "Starting container with image: ${{ steps.image-tag.outputs.full_image }}"
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p "${APP_PORT}:8000" \
            "${{ steps.image-tag.outputs.full_image }}"

      - name: Show running containers
        run: docker ps

      - name: Smoke test deployed app
        run: |
          for attempt in 1 2 3 4 5; do
            RESPONSE=$(curl --silent "http://127.0.0.1:${APP_PORT}/health" || true)
            if [ -n "$RESPONSE" ]; then
              echo "Health endpoint response:"
              echo "$RESPONSE"
              exit 0
            fi
            echo "Waiting for app to become ready..."
            sleep 2
          done
          echo "App did not become ready in time."
          exit 1

      - name: Stop container
        if: always()
        # Clean up even if an earlier step fails.
        run: docker rm -f "${CONTAINER_NAME}" || true